[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-tower"
version = "0.1.0"
description = "ARC Tower - agent observability and traceability control tower"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "cryptography>=42",
    "protobuf>=5.26",
    "opentelemetry-proto>=1.27",
    "prometheus-client>=0.20",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Pull connectors that talk to real platforms. Install only what a deployment needs.
azure = ["azure-monitor-query>=1.4", "azure-identity>=1.17"]
aws = ["boto3>=1.34"]
oidc = ["authlib>=1.3"]
# Sample agent: a client-side app that only uses the standard OpenTelemetry SDK.
agent = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
dev = ["pytest>=8", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]

[tool.setuptools.packages.find]
include = ["arc_tower*"]

[tool.setuptools.package-data]
arc_tower = ["web/templates/**/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
